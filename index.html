<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Rock Paper Scissor</h1>
    <div class="cont">
        <div class="left">
            <span id="label">Computer</span>
            <div class="choose">
                <ul class="option">
                    <li><img class="comp-option" src="images/rock.png" alt="Rock">Rock</li>
                    <li><img class="comp-option" src="images/paper.png" alt="Paper">Paper</li>
                    <li><img class="comp-option" src="images/scissors.png" alt="Scissors">Scissors</li>
                </ul>
            </div>
        </div>
        <div id="vs">VS</div>
        <div class="right">
            <span id="label">You</span>
            <div class="choose">
                <ul class="option">
                    <li><img class="player-option" id="Rock" src="images/rock.png" alt="Rock">Rock</li>
                    <li><img class="player-option" id="Paper" src="images/paper.png" alt="Paper">Paper</li>
                    <li><img class="player-option" id="Scissor" src="images/scissors.png" alt="Scissors">Scissors</li>
                </ul>
            </div>
        </div>
    </div>
    <div class="scoreboard">
        <span class="computer">Computer : 0</span>
        <span class="player">You : 0</span>
    </div>

    <div class="msg-cont">
    </div>
    <script src="app.js"></script>
</body>

</html>
